<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vatsal Tank | Full-stack developer and UI engineer</title>
    <meta name="description" content="Vatsal Tank, a Computer Engineering student building full-stack web apps, realtime systems and interactive interfaces. LiveVote, NaCl, MixCulture Pizzeria and more." />
    <meta property="og:title" content="Vatsal Tank | Full-stack developer and UI engineer" />
    <meta property="og:description" content="Building digital products at the intersection of code, design and interaction." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0a0a0a" />
    <style>
      /* Static first frame of the hero, painted straight from HTML before any JS. The stacked (phone) layout keeps it
         as the hero backdrop; the sideways desktop layout moves the node into its hero panel. */
      body { margin: 0; background: #0a0a0a; }
      .pre { position: absolute; top: 0; left: 0; width: 100%; height: 100vh; height: 100svh; overflow: hidden; }
      .pre picture, .pre img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .pre i { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,10,.85) 0%, rgba(10,10,10,.35) 55%, rgba(10,10,10,.1) 100%), linear-gradient(0deg, rgba(10,10,10,.9) 0%, transparent 45%); }
      /* Static copy of the hero text in a system font, so the largest text paints before JS and can't shift when web fonts land.
         App removes it the moment the live hero text is revealed. */
      .pre .hero { position: absolute; inset: 0; z-index: 2; height: 100%; min-height: 0; }
      .pre .hero__content { visibility: visible !important; }
      .pre .hero__content, .pre .hero__content * { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif !important; }
      .pre .mask > span { transform: none; animation: none; }
      /* a touch larger than the live text, so the live copy never registers as a later, larger LCP candidate */
      .pre .hero__sub { font-size: calc(clamp(1.1rem, 1.6vw, 1.45rem) * 1.15); max-width: 32ch; }
    </style>
  </head>
  <body>
    <div class="pre" aria-hidden="true"><picture><source media="(max-width: 899px) and (orientation: portrait)" srcset="/hero-poster-m.webp" /><img src="/hero-poster.webp" alt="" fetchpriority="high" /></picture><i></i><div class="hero"><div class="hero__content"><p class="eyebrow">&nbsp;</p><div class="hero__name"><span class="mask"><span>Vatsal</span></span><span class="mask"><span>Tank<em>.</em></span></span></div><p class="hero__sub">I build real products at the point where <i>code</i>, <i>design</i> and <i>interaction</i> meet.</p><div class="hero__cta"><span class="btn">View work</span><span class="btn btn--ghost">Résumé</span></div></div></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
